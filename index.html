<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Work Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee; --card: #fffdf9; --text: #22201c; --muted: #77716a; --line: #e4ded5;
  --accent: #2f6b4f; --accent-bg: #e3efe8; --warn: #9a4a1c;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
}
body.evening {
  --bg: #f3eee8; --accent: #8a4b2a; --accent-bg: #f4e4d8; --muted: #6b655e;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171614; --card: #201f1c; --text: #ece8e1; --muted: #9a948b; --line: #34312c; --accent: #7cc4a0; --accent-bg: #1f3329; --warn: #e8a27a; }
  body.evening { --bg: #181513; --accent: #e3a17c; --accent-bg: #3a261b; --muted: #9a948b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.6 var(--font-body); }
.wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 24px; }
body.evening .wrap { max-width: 1180px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand { font: 500 1.6rem/1.1 var(--font-display); margin: 0; }
body.evening .brand { font-size: 1.9rem; }
.date { font-size: 0.875rem; color: var(--muted); }

/* Layout: one column for work, turntable beside the shelf in the evening */
.stage { display: grid; gap: 24px; }
.left { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
body.evening .stage { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
body.evening .left { flex: 1 1 420px; max-width: 500px; }
body.evening .choices { flex: 1.4 1 460px; min-width: 0; }
@media (min-width: 960px) { body.evening .left { position: sticky; top: 24px; } }

/* Work buttons */
.choices { display: grid; gap: 12px; }
.choice {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.choice:hover { border-color: var(--accent); }
.choice:focus-visible, .ctl:focus-visible, .connect:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
.icon {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--card);
}
.icon svg { width: 16px; height: 16px; margin-left: 2px; }
.choice .name { display: block; font: 500 1.08rem/1.25 var(--font-display); }
.choice .sub { display: block; font-size: 0.8125rem; color: var(--muted); }

/* Evening shelf */
.artist { display: grid; gap: 10px; }
.artist + .artist { margin-top: 18px; }
.artist h2 { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 12px; }
.tile { display: grid; gap: 6px; align-content: start; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--text); font: inherit; }
.tile .cover {
  aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--accent-bg);
  display: grid; place-items: center; transition: transform .15s ease, box-shadow .15s ease;
}
.tile:hover .cover { transform: translateY(-3px); }
.tile[aria-pressed="true"] .cover { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.tile .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .fallback { font: 500 0.85rem/1.2 var(--font-display); padding: 10px; color: var(--accent); text-align: center; }
.tile .t { font-size: 0.8125rem; line-height: 1.25; }
.tile .y { font-size: 0.75rem; color: var(--muted); margin-top: -4px; }

/* Turntable */
.table[hidden] { display: none; }
.table { position: relative; width: 100%; aspect-ratio: 52 / 47; border-radius: 18px; background: #2b2521; overflow: hidden; }
.platter { position: absolute; left: 6.15%; top: 7.45%; width: 76.9%; aspect-ratio: 1; border-radius: 50%; background: #171513; }
.vinyl {
  position: absolute; inset: 2%; border-radius: 50%;
  background: repeating-radial-gradient(circle at center, #121110 0 1px, #1e1c1a 1px 3px);
  animation: spin 1.8s linear infinite; animation-play-state: paused;
}
.table.playing .vinyl { animation-play-state: running; }
.label {
  position: absolute; left: 50%; top: 50%; width: 35%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; overflow: hidden; background: #3a332e; color: #cdbfae;
  display: grid; place-items: center; text-align: center; padding: 10%;
  font: 500 0.8rem/1.2 var(--font-display);
}
.label img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.label img[hidden] { display: none; }
.label::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 7%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border-radius: 50%; background: #f3eee8;
}
.pivot { position: absolute; left: 86.15%; top: 7.66%; width: 9.2%; aspect-ratio: 1; border-radius: 50%; background: #4a423c; border: 2px solid #5c534c; }
.arm {
  position: absolute; left: 89.6%; top: 12.8%; width: 1.6%; height: 63.8%; border-radius: 4px;
  background: #cfc6ba; transform-origin: 50% 0; transition: transform .9s cubic-bezier(.3, .1, .2, 1);
}
.table.playing .arm { transform: rotate(24deg); }
.arm::after { content: ""; position: absolute; left: -110%; bottom: -8%; width: 320%; height: 11%; border-radius: 4px; background: #8b8178; }
.rpm { position: absolute; left: 6.15%; bottom: 3.4%; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b8ada1; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: #5c534c; }
.table.playing .lamp { background: #e0b65a; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .vinyl { animation: none; } .arm { transition: none; } }

/* Now playing bar */
.now {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--accent);
}
.now[hidden], .signin[hidden] { display: none; }
.now img { flex: none; width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--accent-bg); }
body.evening .now img { display: none; }
.now .meta { flex: 1; min-width: 0; }
.now .track { display: block; font: 500 1.05rem/1.25 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .by { display: block; font-size: 0.8125rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { display: flex; gap: 6px; flex: none; }
.ctl {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer;
}
.ctl:hover { border-color: var(--accent); }
.ctl.main { background: var(--accent); border-color: var(--accent); color: var(--card); width: 46px; height: 46px; }
.ctl svg { width: 16px; height: 16px; }

.signin { display: grid; gap: 10px; padding: 18px; border-radius: 14px; border: 1px dashed var(--line); background: var(--card); }
.signin p { margin: 0; font-size: 0.9375rem; color: var(--muted); }
.connect {
  justify-self: start; padding: 10px 18px; border-radius: 999px; border: 0;
  background: var(--accent); color: var(--card); font: 500 0.9375rem var(--font-body); cursor: pointer;
}
/* Full screen button */
.headright { display: flex; align-items: center; gap: 14px; }
.fs {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent;
  color: var(--muted); display: grid; place-items: center; cursor: pointer;
}
.fs:hover { color: var(--text); border-color: var(--accent); }
.fs:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.fs svg { width: 16px; height: 16px; }

/* Full screen: everything fills the window; the shelf scrolls on its own beside the turntable */
body.full .wrap { max-width: none; height: 100vh; padding: 28px 44px 20px; display: flex; flex-direction: column; gap: 20px; }
body.full .switch { display: none; }
body.full .stage { flex: 1; min-height: 0; }
body.full.evening .stage { flex-wrap: nowrap; gap: 48px; align-items: stretch; }
body.full.evening .left {
  flex: 0 0 auto; max-width: none; position: static; align-content: center;
  width: min(48vw, calc((100vh - 250px) * 52 / 47));
}
body.full.evening .choices { flex: 1 1 auto; overflow-y: auto; padding: 6px 12px 24px 6px; }
body.full.evening .shelf { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px; }
body.full.evening .artist + .artist { margin-top: 26px; }
body.full .wrap > .rule { min-height: 1.4em; }
@media (max-width: 760px) { body.full.evening .stage { flex-wrap: wrap; } body.full.evening .left { width: 100%; } }

.rule { margin: 0; font-size: 0.875rem; color: var(--muted); }
.rule.warn { color: var(--warn); }
.switch { justify-self: start; background: none; border: 0; padding: 0; font: inherit; font-size: 0.875rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand" id="brand">Work Music</h1>
    <span class="headright">
      <span class="date" id="date"></span>
      <button class="fs" id="fs" type="button" aria-label="Full screen" title="Full screen (F)"></button>
    </span>
  </header>

  <div class="signin" id="signin" hidden>
    <p>Sign in to Spotify once and this page plays music by itself. It remembers you after that.</p>
    <button class="connect" id="connect" type="button">Sign in to Spotify</button>
  </div>

  <div class="stage">
    <div class="left">
      <div class="table" id="table" hidden aria-hidden="true">
        <div class="platter">
          <div class="vinyl">
            <div class="label"><img id="labelImg" alt="" hidden><span id="labelText">Pick an album</span></div>
          </div>
        </div>
        <div class="pivot"></div>
        <div class="arm"></div>
        <div class="rpm"><span class="lamp"></span><span>33⅓ rpm</span></div>
      </div>

      <div class="now" id="now" hidden aria-live="polite">
        <img id="art" alt="">
        <div class="meta">
          <span class="track" id="track"></span>
          <span class="by" id="by"></span>
        </div>
        <div class="controls">
          <button class="ctl" id="prev" type="button" aria-label="Previous track">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.5v13a1 1 0 0 1-1.53.85L9 13.2a1.4 1.4 0 0 1 0-2.4l9.47-6.15A1 1 0 0 1 20 5.5z"/></svg>
          </button>
          <button class="ctl main" id="toggle" type="button" aria-label="Pause"></button>
          <button class="ctl" id="next" type="button" aria-label="Next track">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.5v13a1 1 0 0 0 1.53.85L15 13.2a1.4 1.4 0 0 0 0-2.4L5.53 4.65A1 1 0 0 0 4 5.5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="choices" id="choices"></div>
  </div>

  <p class="rule" id="rule"></p>
  <button class="switch" id="switch" type="button"></button>
</div>

<script>
// ---- Spotify app settings ----
const CLIENT_ID = "b274d5418158410898b9c31d29c8a290";
const REDIRECT_URI = "https://giant-salmon.github.io/music/";

// ---- Your music. To add or swap anything, ask Claude in chat for an updated file. ----

// Shown during the workday (5 am to 5 pm).
const WORK = [
  { name: "Lofi Girl", sub: "beats to relax/study to · about 500 tracks",
    uri: "spotify:playlist:0vvXsWCC9xrXsKd4FyS8kM" },
  { name: "The Imitation Game", sub: "Soundtrack · Alexandre Desplat · 51 min",
    uri: "spotify:album:2CsfKW5tze2DZKq49iARk1", album: true },
  { name: "Synthwave", sub: "beats to chill/game to · Lofi Girl · about 400 tracks",
    uri: "spotify:playlist:1YIe34rcmLjCYpY9wJoM2p" },
  { name: "The Theory of Everything", sub: "Soundtrack · Jóhann Jóhannsson · 27 tracks",
    uri: "spotify:album:02VRifrsiTM73hPGjXduRQ", album: true }
];

// Shown in the evening (5 pm to 5 am) on the turntable shelf. Full-length albums, oldest first.
const EVENING = [
  { artist: "Vampire Weekend", albums: [
    { name: "Vampire Weekend", year: 2008, uri: "spotify:album:7n8NJkGKAl2np1bXiRn0CY" },
    { name: "Contra", year: 2010, uri: "spotify:album:0H8cHlbp6eieUUOLmv4FzJ" },
    { name: "Modern Vampires of the City", year: 2013, uri: "spotify:album:1GXMNFfoHF4sN7lG8gZq1j" },
    { name: "Father of the Bride", year: 2019, uri: "spotify:album:1A3nVEWRJ8yvlPzawHI1pQ" },
    { name: "Only God Was Above Us", year: 2024, uri: "spotify:album:1W04wu2W4OIcuiNc5AMB3y" }
  ]},
  { artist: "Role Model", albums: [
    { name: "Rx", year: 2022, uri: "spotify:album:1PhcZ4Ov6ZxuaUZF8r9rbk" },
    { name: "Kansas Anymore", year: 2024, uri: "spotify:album:4OZ6nCbn8w0cHr1m0qiD2s" },
    { name: "Chuck Timely & The Hourglass", year: 2026, uri: "spotify:album:7fZFja60WuvgF48NW1au0R" }
  ]},
  { artist: "Remi Wolf", albums: [
    { name: "Juno", year: 2021, uri: "spotify:album:7tJ8Wtej161vR0uCbGDiDR" },
    { name: "Big Ideas", year: 2024, uri: "spotify:album:7HQOEMCDGKY8eJyQPdsnYH" },
    { name: "Mud", year: 2026, uri: "spotify:album:19cvoEE5d3pMkxLFL5TsAG" }
  ]},
  { artist: "Sylvan Esso", albums: [
    { name: "Sylvan Esso", year: 2014, uri: "spotify:album:5Abelpx4c3FzhTOZP3ZIvS" },
    { name: "What Now", year: 2017, uri: "spotify:album:1fo3f7dtAoeYMpiN5FvK9T" },
    { name: "Free Love", year: 2020, uri: "spotify:album:2KAPJ40On8JY1Yt64JJgTk" },
    { name: "No Rules Sandy", year: 2022, uri: "spotify:album:6rl4rzZxECegl9PdYG0hfk" },
    { name: "Ow ∞", year: 2026, uri: "spotify:album:4VuKsKSeMRnaAou9kYsNhS" }
  ]},
  { artist: "Charli xcx", albums: [
    { name: "brat", year: 2024, uri: "spotify:album:2lIZef4lzdvZkiiCzvPKj7" }
  ]},
  { artist: "Ashe", albums: [
    { name: "The Girl of Your Dreams", year: 2026, uri: "spotify:album:03HD0ohJOvejRoesXWKZFl" }
  ]},
  { artist: "Of Monsters and Men", albums: [
    { name: "My Head Is an Animal", year: 2011, uri: "spotify:album:4p9dVvZDaZliSjTCbFRhJy" },
    { name: "Beneath the Skin", year: 2015, uri: "spotify:album:2mD97VgxTRfwB8F5tvkwrL" }
  ]}
];

const EVENING_STARTS = 17; // 5 pm
const EVENING_ENDS = 5;    // 5 am

// ---------------------------------------------------------------------------

const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const $ = (id) => document.getElementById(id);
const choicesEl = $("choices"), ruleEl = $("rule"), switchEl = $("switch");

let mode = null;          // "work" or "evening"
let manual = false;       // true once you switch views by hand
let currentUri = null;
let buttons = [];

// Album covers, fetched from Spotify once and remembered in this browser.
const COVERS = "workMusic.covers";
let covers = {};
try { covers = JSON.parse(localStorage.getItem(COVERS)) || {}; } catch (e) {}
const idOf = (uri) => uri.split(":")[2];

function setRule(text, warn) {
  ruleEl.textContent = text;
  ruleEl.classList.toggle("warn", !!warn);
}

function clockMode() {
  const h = new Date().getHours();
  return (h >= EVENING_STARTS || h < EVENING_ENDS) ? "evening" : "work";
}

function workButton(opt) {
  const b = document.createElement("button");
  b.className = "choice";
  b.type = "button";
  b.setAttribute("aria-pressed", opt.uri === currentUri ? "true" : "false");
  b.innerHTML = '<span class="icon">' + PLAY_ICON + '</span><span><span class="name"></span><span class="sub"></span></span>';
  b.querySelector(".name").textContent = "Play " + opt.name;
  b.querySelector(".sub").textContent = opt.sub;
  b.addEventListener("click", () => choose(opt, b));
  buttons.push(b);
  return b;
}

function albumTile(al) {
  const opt = { uri: al.uri, album: true, name: al.name };
  const b = document.createElement("button");
  b.className = "tile";
  b.type = "button";
  b.setAttribute("aria-pressed", al.uri === currentUri ? "true" : "false");
  b.setAttribute("aria-label", "Play " + al.name + ", " + al.year);
  const cover = document.createElement("span");
  cover.className = "cover";
  const url = covers[idOf(al.uri)];
  if (url) {
    const img = document.createElement("img");
    img.src = url; img.alt = ""; img.loading = "lazy";
    cover.appendChild(img);
  } else {
    const f = document.createElement("span");
    f.className = "fallback";
    f.textContent = al.name;
    cover.appendChild(f);
  }
  const t = document.createElement("span"); t.className = "t"; t.textContent = al.name;
  const y = document.createElement("span"); y.className = "y"; y.textContent = al.year;
  b.append(cover, t, y);
  b.addEventListener("click", () => choose(opt, b));
  buttons.push(b);
  return b;
}

function render(newMode) {
  mode = newMode;
  buttons = [];
  choicesEl.innerHTML = "";
  const evening = mode === "evening";
  document.body.classList.toggle("evening", evening);
  $("table").hidden = !evening;
  $("brand").textContent = evening ? "Evening Music" : "Work Music";
  document.title = evening ? "Evening Music" : "Work Music";
  $("date").textContent =
    new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

  if (!evening) {
    WORK.forEach(opt => choicesEl.appendChild(workButton(opt)));
  } else {
    EVENING.forEach(group => {
      const sec = document.createElement("section");
      sec.className = "artist";
      const h = document.createElement("h2");
      h.textContent = group.artist;
      const grid = document.createElement("div");
      grid.className = "shelf";
      group.albums.forEach(al => grid.appendChild(albumTile(al)));
      sec.append(h, grid);
      choicesEl.appendChild(sec);
    });
  }

  if (!currentUri && !ruleEl.classList.contains("warn")) setRule(evening
    ? "Pick an album from the shelf. It plays right here."
    : "Pick one. It plays right here until you pause it.");
  switchEl.textContent = evening ? "Show work music" : "Show evening albums";
}

switchEl.addEventListener("click", () => {
  manual = true;
  render(mode === "evening" ? "work" : "evening");
});

// Swap views on their own at 5 pm and 5 am, unless you switched by hand.
// Whatever is playing keeps playing.
setInterval(() => {
  if (!manual && clockMode() !== mode) render(clockMode());
}, 60000);

// ---- Turntable label ----
function setLabel(url, text) {
  const img = $("labelImg");
  if (url) { img.src = url; img.hidden = false; }
  else { img.hidden = true; img.removeAttribute("src"); }
  $("labelText").textContent = url ? "" : (text || "Pick an album");
}

// ===========================================================================
// Spotify sign-in (PKCE: no secret key, the sign-in stays in this browser)
// ===========================================================================
const SCOPES = "streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state";
const STORE = "workMusic.auth";

function loadAuth() { try { return JSON.parse(localStorage.getItem(STORE)) || null; } catch (e) { return null; } }
function saveAuth(a) { try { localStorage.setItem(STORE, JSON.stringify(a)); } catch (e) {} }
function clearAuth() { try { localStorage.removeItem(STORE); } catch (e) {} }

function b64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function signIn() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  try { sessionStorage.setItem("workMusic.verifier", verifier); } catch (e) {}
  const params = new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT_URI,
    scope: SCOPES, code_challenge_method: "S256", code_challenge: challenge
  });
  location.href = "https://accounts.spotify.com/authorize?" + params;
}

async function tokenRequest(body) {
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams(body)
  });
  if (!res.ok) throw new Error("token " + res.status);
  const j = await res.json();
  const prev = loadAuth() || {};
  const auth = {
    access: j.access_token,
    refresh: j.refresh_token || prev.refresh,
    expires: Date.now() + (j.expires_in - 60) * 1000
  };
  saveAuth(auth);
  return auth;
}

async function finishSignInIfReturning() {
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", REDIRECT_URI);
  if (q.has("error")) { setRule("Spotify sign-in was cancelled. Try again when you're ready.", true); return; }
  let verifier = null;
  try { verifier = sessionStorage.getItem("workMusic.verifier"); } catch (e) {}
  if (!verifier) { setRule("Sign-in didn't finish. Try signing in again.", true); return; }
  await tokenRequest({
    grant_type: "authorization_code", code: q.get("code"),
    redirect_uri: REDIRECT_URI, client_id: CLIENT_ID, code_verifier: verifier
  });
}

let refreshing = null;
async function getToken() {
  const a = loadAuth();
  if (!a) return null;
  if (Date.now() < a.expires) return a.access;
  if (!a.refresh) return null;
  if (!refreshing) {
    refreshing = tokenRequest({ grant_type: "refresh_token", refresh_token: a.refresh, client_id: CLIENT_ID })
      .then(x => x.access)
      .catch(() => { clearAuth(); return null; })
      .finally(() => { refreshing = null; });
  }
  return refreshing;
}

function showSignIn(msg) {
  $("signin").hidden = false;
  if (msg) setRule(msg, true);
}
$("connect").addEventListener("click", signIn);

// Fetch any covers this browser hasn't saved yet (one small request per album, only the first time).
async function loadCovers() {
  const ids = EVENING.flatMap(g => g.albums.map(a => idOf(a.uri))).filter(id => !covers[id]);
  if (!ids.length) return;
  const t = await getToken();
  if (!t) return;
  await Promise.all(ids.map(async id => {
    try {
      const r = await fetch("https://api.spotify.com/v1/albums/" + id, { headers: { Authorization: "Bearer " + t } });
      if (!r.ok) return;
      const j = await r.json();
      const imgs = (j.images || []).slice().sort((a, b) => (a.width || 0) - (b.width || 0));
      const pick = imgs.find(i => (i.width || 0) >= 300) || imgs[imgs.length - 1];
      if (pick) covers[id] = pick.url;
    } catch (e) {}
  }));
  try { localStorage.setItem(COVERS, JSON.stringify(covers)); } catch (e) {}
  if (mode === "evening") render("evening");
}

// ===========================================================================
// The in-page player (Spotify Web Playback SDK)
// ===========================================================================
let player = null, deviceId = null, pending = null, paused = true;

function setToggleIcon() {
  $("toggle").innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
  $("toggle").setAttribute("aria-label", paused ? "Play" : "Pause");
}

function startPlayer() {
  if (player) return;
  const s = document.createElement("script");
  s.src = "https://sdk.scdn.co/spotify-player.js";
  document.body.appendChild(s);
}

window.onSpotifyWebPlaybackSDKReady = () => {
  player = new Spotify.Player({
    name: "Work Music page",
    getOAuthToken: cb => { getToken().then(t => { if (t) cb(t); else showSignIn("Your Spotify sign-in expired. Sign in again."); }); },
    volume: 0.8
  });

  player.addListener("ready", ({ device_id }) => {
    deviceId = device_id;
    if (pending) { const p = pending; pending = null; playUri(p); }
  });
  player.addListener("not_ready", () => { deviceId = null; $("table").classList.remove("playing"); });

  player.addListener("player_state_changed", state => {
    if (!state || !state.track_window || !state.track_window.current_track) {
      $("table").classList.remove("playing");
      return;
    }
    const t = state.track_window.current_track;
    paused = state.paused;
    $("table").classList.toggle("playing", !paused);
    $("now").hidden = false;
    $("track").textContent = t.name;
    $("by").textContent = t.artists.map(a => a.name).join(", ") + " · " + t.album.name;
    const imgs = (t.album.images || []).slice().sort((a, b) => (a.width || 0) - (b.width || 0));
    const small = imgs.find(i => (i.width || 0) >= 64) || imgs[0];
    const big = imgs.find(i => (i.width || 0) >= 300) || imgs[imgs.length - 1];
    if (small) $("art").src = small.url;
    if (big) setLabel(big.url);
    setToggleIcon();
  });

  player.addListener("initialization_error", () =>
    setRule("This browser can't play Spotify here. Chrome on a laptop works best.", true));
  player.addListener("authentication_error", () => { clearAuth(); showSignIn("Spotify needs you to sign in again."); });
  player.addListener("account_error", () =>
    setRule("Spotify says this account can't play here. It needs Premium, and the account has to be added under User Management in your Spotify developer app.", true));
  player.addListener("playback_error", () =>
    setRule("Spotify couldn't play that one. Try again, or pick something else.", true));

  player.connect();
};

async function api(path, method, body) {
  const t = await getToken();
  if (!t) { showSignIn("Sign in to Spotify to play music."); throw new Error("no token"); }
  const res = await fetch("https://api.spotify.com/v1" + path, {
    method,
    headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { clearAuth(); showSignIn("Spotify needs you to sign in again."); throw new Error("401"); }
  if (!res.ok && res.status !== 204) throw new Error(String(res.status));
  return res;
}

async function playUri(opt) {
  if (!deviceId) { pending = opt; setRule("Getting the player ready…"); return; }
  try {
    // Playlists start on shuffle so they don't open on the same song every day; albums play in order.
    await api("/me/player/play?device_id=" + deviceId, "PUT", { context_uri: opt.uri });
    api("/me/player/shuffle?state=" + (opt.album ? "false" : "true") + "&device_id=" + deviceId, "PUT").catch(() => {});
    setRule(opt.album
      ? "Albums stop when they end. Pick it again to hear it twice."
      : "This runs until you pause it. Pick another any time to switch.");
  } catch (e) {
    if (e.message === "403") setRule("Spotify blocked playback. Check that this account is listed under User Management in your Spotify developer app.", true);
    else if (e.message !== "no token" && e.message !== "401") setRule("Spotify didn't start that one. Try again in a moment.", true);
  }
}

function choose(opt, btn) {
  currentUri = opt.uri;
  buttons.forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  // Put the cover on the record right away; the arm drops once the music starts.
  if (opt.album && covers[idOf(opt.uri)]) setLabel(covers[idOf(opt.uri)]);
  else setLabel(null, opt.name);
  // Browsers only allow sound after a click; this tells the player the click happened.
  if (player && player.activateElement) { try { player.activateElement(); } catch (e) {} }
  if (!loadAuth()) { showSignIn("Sign in to Spotify first. After that, one click plays."); return; }
  playUri(opt);
}

$("toggle").addEventListener("click", () => player && player.togglePlay());
$("next").addEventListener("click", () => player && player.nextTrack());
$("prev").addEventListener("click", () => player && player.previousTrack());

// Space bar pauses and resumes, unless you're typing somewhere.
document.addEventListener("keydown", e => {
  if (e.code === "Space" && player && !$("now").hidden && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) {
    e.preventDefault();
    player.togglePlay();
  }
});

// ---- Full screen ----
const FS_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function syncFull() {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle("full", on);
  $("fs").innerHTML = on ? FS_OFF : FS_ON;
  $("fs").setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
  $("fs").title = on ? "Exit full screen (Esc)" : "Full screen (F)";
}
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
$("fs").addEventListener("click", toggleFull);
document.addEventListener("fullscreenchange", syncFull);
document.addEventListener("keydown", e => {
  if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey &&
      !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) toggleFull();
});
if (!document.fullscreenEnabled) $("fs").hidden = true;
syncFull();

// ---- Start ----
render(clockMode());
setToggleIcon();
(async () => {
  try { await finishSignInIfReturning(); }
  catch (e) { setRule("Sign-in didn't finish. Try signing in again.", true); }
  if (loadAuth()) { $("signin").hidden = true; startPlayer(); loadCovers(); }
  else showSignIn();
})();
</script>
</body>
</html>
